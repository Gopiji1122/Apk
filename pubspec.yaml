name: pdfforge
description: Document scanner + PDF editor, fully offline.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  cunning_document_scanner: ^1.2.3
  google_mlkit_text_recognition: ^0.13.1
  pdfrx: ^1.3.5
  pdf: ^3.11.0
  syncfusion_flutter_pdf: ^27.1.58
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  image: ^4.2.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0
flutter:
  uses-material-design: true
