name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Verify the right sources were pushed
        run: |
          grep -n "pdfrx" pubspec.yaml
          grep -q "pdfrx: ^2" pubspec.yaml || (echo "OLD pubspec.yaml pushed - replace it with the new one" && exit 1)
          grep -q "mergePdfs" lib/main.dart || (echo "OLD lib/main.dart pushed - replace it with the new one" && exit 1)
      - name: Generate Android shell and add our code
        run: |
          flutter create --org com.pdfforge --project-name pdfforge --platforms=android app
          rm -rf app/lib && cp -r lib app/lib && cp pubspec.yaml app/pubspec.yaml
      - name: Configure Android
        working-directory: app
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: pdfforge-apk
          path: app/build/app/outputs/flutter-apk/*.apk
