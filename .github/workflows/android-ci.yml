name: Android CI — ARM64 APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Offline Tesseract Fast Models (English + Hindi) into APK Assets
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fsSL "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -o app/src/main/assets/tessdata/eng.traineddata
          curl -fsSL "https://github.com/tesseract-ocr/tessdata_fast/raw/main/hin.traineddata" -o app/src/main/assets/tessdata/hin.traineddata
          ls -lh app/src/main/assets/tessdata/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Bundle DocAligner LCNet100 ONNX model (Apache 2.0)
        run: |
          mkdir -p app/src/main/assets/models
          MODEL="app/src/main/assets/models/docaligner_lcnet100.onnx"
          curl -fL --retry 3 -o "$MODEL" \
            "https://huggingface.co/7rplus/pagescan-weights/resolve/main/lcnet100_h_e_bifpn_256_fp32.onnx" \
          || curl -fL --retry 3 -o "$MODEL" \
            "https://huggingface.co/kittypdf/DocAligner-ONNX/resolve/main/docaligner-lcnet100.onnx" \
          || curl -fL --retry 3 -o "$MODEL" \
            "https://huggingface.co/pauldubois98/musicocr-models/resolve/main/docaligner-lcnet100.onnx"
          ls -lh "$MODEL"
          SIZE=$(stat -c%s "$MODEL")
          echo "DocAligner ONNX size: $SIZE bytes"
          test "$SIZE" -gt 4000000

      - name: Ensure Personal Signing Keystore Exists
        run: |
          if [ ! -f app/personal-signing.keystore ]; then
            echo "Generating fallback personal-signing.keystore..."
            keytool -genkeypair -v \
              -keystore app/personal-signing.keystore \
              -alias offlinepdf \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass offlinepdf2026 \
              -keypass offlinepdf2026 \
              -dname "CN=OfflinePDFStudio, O=Personal, C=IN"
          fi
          ls -lh app/personal-signing.keystore

      - name: Build Debug ARM64 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePdfStudio-ProEngine-v4-arm64-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare Optional Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KEYSTORE_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Build Release ARM64 APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePdfStudio-ProEngine-v4-arm64-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
