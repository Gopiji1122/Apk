name: Build Aura AI v4 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone llama.cpp v1.0.0 stable engine
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch v1.0.0 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Universal Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Aura AI v4 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraAI-v4-universal-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
