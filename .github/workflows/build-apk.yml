name: Build Aura PDF Editor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/app-debug.apk release_output/AuraPDFEditor-v1.0.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraPDFEditor-APK
          path: release_output/AuraPDFEditor-v1.0.0-debug.apk
